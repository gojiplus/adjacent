name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: make check-python
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker run --rm -v "$PWD:/work:ro" -w /work rhysd/actionlint:1.7.12
