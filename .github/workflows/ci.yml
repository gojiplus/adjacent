name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: make check-python
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: action-source
      - name: Prepare a separate caller workspace
        run: |
          cp action-source/README.md README.md
          printf 'required-version = "==0.4.0"\n' > uv.toml
      - uses: ./action-source
        id: adjacent
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          similarity_method: topics
          dry_run: 'true'
      - name: Check outputs and dry-run behavior
        env:
          CHANGED: ${{ steps.adjacent.outputs.changed }}
          RECOMMENDATION_COUNT: ${{ steps.adjacent.outputs.recommendation_count }}
        run: |
          [[ "$CHANGED" == 'true' || "$CHANGED" == 'false' ]]
          [[ "$RECOMMENDATION_COUNT" =~ ^[0-9]+$ ]]
          cmp action-source/README.md README.md
          git -C action-source diff --exit-code
