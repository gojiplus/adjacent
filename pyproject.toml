[project]
name = "adjacent"
# Unpublished: releases are the git tags (v2.0, ...) that workflows pin with uses:.
version = "0"
requires-python = ">=3.13"
dependencies = ["requests", "scikit-learn"]

[dependency-groups]
dev = ["black", "isort", "flake8", "pytest", "responses"]

[tool.uv]
package = false

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.codespell]
builtin = "clear,rare,en-GB_to_en-US"
skip = "*.pdf,*.png,*.jpg,*.jpeg,*.gif,*.csv,*.tsv,*.json,*.geojson,*.graphml,*.ipynb,*.html,*.svg,*.bib,*.bbl,*.lock,*.parquet,*.rda,*.rds,*.RData,*.dta,*.xlsx,*.xml,*.min.js,*.map,*.log,*.aux"
