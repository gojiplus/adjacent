name: 'Adjacent: Related Repos Recommender'
description: 'Recommend related public repositories from the same owner using topics and README similarity.'
author: 'Gaurav Sood'
branding:
  icon: link-2
  color: blue
inputs:
  repo:
    description: 'Target repository in owner/name format'
    default: ${{ github.repository }}
  token:
    description: 'GitHub token for API access'
    required: true
  similarity_method:
    description: 'topics, readme, or combined'
    default: 'combined'
  topic_weight:
    description: 'Topic weight in combined mode, from 0 to 1'
    default: '0.6'
  exclude_repos:
    description: 'Comma-separated short names or owner/name exclusions'
    default: ''
  max_repos:
    description: 'Maximum recommendations (positive integer)'
    default: '5'
  readme_path:
    description: 'Existing marked README within the checkout'
    default: 'README.md'
  min_score:
    description: 'Require a score strictly greater than this value, from 0 to 1'
    default: '0.1'
  include_forks:
    description: 'Include public forks'
    default: 'false'
  include_archived:
    description: 'Include public archived repositories'
    default: 'false'
  include_templates:
    description: 'Include public template repositories'
    default: 'false'
  dry_run:
    description: 'Report proposed content without writing the README'
    default: 'false'
outputs:
  changed:
    description: 'Whether the proposed README differs, including in dry-run mode'
    value: ${{ steps.adjacent.outputs.changed }}
  recommendation_count:
    description: 'Number of recommendations selected'
    value: ${{ steps.adjacent.outputs.recommendation_count }}
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        python-version: '3.13'
        # The default cache key hashes the caller's workspace, not this action's lock.
        enable-cache: false
    - name: Recommend repositories
      id: adjacent
      working-directory: ${{ github.action_path }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        GITHUB_REPOSITORY: ${{ inputs.repo }}
        SIMILARITY_METHOD: ${{ inputs.similarity_method }}
        TOPIC_WEIGHT: ${{ inputs.topic_weight }}
        EXCLUDE_REPOS: ${{ inputs.exclude_repos }}
        MAX_REPOS: ${{ inputs.max_repos }}
        README_PATH: ${{ inputs.readme_path }}
        MIN_SCORE: ${{ inputs.min_score }}
        INCLUDE_FORKS: ${{ inputs.include_forks }}
        INCLUDE_ARCHIVED: ${{ inputs.include_archived }}
        INCLUDE_TEMPLATES: ${{ inputs.include_templates }}
        DRY_RUN: ${{ inputs.dry_run }}
      run: uv run --locked --no-dev python -m adjacent
